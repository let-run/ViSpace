<!doctype html><meta charset="utf-8"><title>SQLite storage checks</title><pre id="result">Running…</pre>
<script type="module">
import {InventoryStorage} from './storage-client.js';
import {requireWorkspacePermission} from './workspace-access.js';
import init,{browser_storage_decode} from './pkg/vispace.js';
const output=document.querySelector('#result');const ok=(test,message)=>{if(!test)throw Error(message);output.textContent+='\nPASS '+message;};
const fresh=()=>new InventoryStorage();const stop=async client=>{client.worker.terminate();for(let i=0;i<100;i++){if(!(await navigator.locks.query()).held.some(l=>l.name==='bom-inventory.sqlite'))return;await new Promise(r=>setTimeout(r,20));}throw Error('Worker did not release database lock');};
try{
 if(new URL(location.href).searchParams.get('storageTest')!=='isolated-disposable-origin')throw Error('Use the isolated test runner, not an inventory app origin.');const existingRoot=await navigator.storage.getDirectory();for await(const[name]of existingRoot.entries())if(['.bom-inventory-sqlite','bom-inventory-workspace'].includes(name))throw Error('This origin already contains inventory data; use a new isolated browser profile.');await init();let prompted=false;for(const state of ['denied','prompt'])await requireWorkspacePermission({queryPermission:async()=>state,requestPermission:()=>{prompted=true;}}).then(()=>{throw Error('Missing permission was accepted');},()=>ok(true,'Directory writes pause when permission is '+state));ok(!prompted,'Background saves never request directory permission');let client=fresh();const legacy={parts:[{id:crypto.randomUUID().toUpperCase(),barcode:crypto.randomUUID().toUpperCase(),number:'Legacy browser inventory',stock:4}],projects:[],allocations:[],purchases:[],bom:[],storage:{}};const initial=await client.init(JSON.stringify(legacy),null);ok(JSON.parse(initial.snapshot).parts[0].number==='Legacy browser inventory','Existing browser inventory migrates into SQLite');ok(initial.applicationId,'SQLite creates a durable app identity');
 const duplicate=fresh();await duplicate.init(null,null).then(()=>{throw Error('Concurrent writer opened SQLite');},e=>ok(e.message.includes('another tab'),'A second writer is rejected'));duplicate.worker.terminate();
 const png=new Uint8Array([137,80,78,71,13,10,26,10,1,2,3]),pdf=new TextEncoder().encode('%PDF-1.7 fixture bytes');const uri=(mime,b)=>`data:${mime};base64,${btoa(String.fromCharCode(...b))}`;
 const data={parts:[{id:crypto.randomUUID().toUpperCase(),barcode:crypto.randomUUID().toUpperCase(),number:'Browser part',stock:7,image:{originalPath:uri('image/png',png),previewPath:uri('image/png',png),thumbnailPath:uri('image/png',png)},datasheet:uri('application/pdf',pdf),notes:{text:'asset:literal note',images:{diagram:uri('image/png',png)}}}],projects:[{name:'Browser project',description:'Test'}],purchases:[],allocations:[],storage:{},bom:[]};
 const saved=await client.save(JSON.stringify(data));ok(JSON.parse(saved.snapshot).parts[0].stock===7,'Inventory commits to SQLite');ok(JSON.parse(saved.snapshot).parts[0].notes.text==='asset:literal note','Literal asset-like note text round-trips');
 await client.call('save',{next:JSON.stringify(data),expected:-1}).then(()=>{throw Error('Stale revision accepted');},()=>ok(true,'Stale writes cannot overwrite inventory'));
 const root=await navigator.storage.getDirectory();const folder=await root.getDirectoryHandle('selected-workspace-test',{create:true});await client.bind(folder);
 const files=await folder.getDirectoryHandle('Attachments');let count=0;const browser=await files.getDirectoryHandle('browser');for await(const[name,handle]of browser.entries()){count++;const bytes=new Uint8Array(await(await handle.getFile()).arrayBuffer());ok(name.endsWith('.png')?bytes.every((b,i)=>b===png[i]):bytes.every((b,i)=>b===pdf[i]),'Attachment bytes are preserved');}ok(count===2,'Repeated image references share one separate file');
 const chunks=await folder.getDirectoryHandle('inventory.actions');let records=[];for await(const[,handle]of chunks.entries())records.push(...JSON.parse(browser_storage_decode(new Uint8Array(await(await handle.getFile()).arrayBuffer()))));ok(records.length>=2,'Workspace contains replayable action chunks');ok(!JSON.stringify(records).includes('data:image'),'Image bytes are absent from action chunks');
 const backup=await client.backup();ok(new TextDecoder().decode(backup.slice(0,15))==='SQLite format 3','Backup is a genuine SQLite database');ok(!new TextDecoder().decode(backup).includes('data:image'),'SQLite stores image references rather than data URLs');let backupText="";for(let i=0;i<backup.length;i+=32768)backupText+=String.fromCharCode(...backup.subarray(i,i+32768));window.sqliteBackup=btoa(backupText);
 const backups=await folder.getDirectoryHandle('backups');let backupCount=0;for await(const[name]of backups.entries())if(name.endsWith('.sqlite'))backupCount++;ok(backupCount===1,'Backup is written to the selected directory');
 const localData=JSON.parse(client.state.snapshot);localData.projects[0].kicad={path:'local-only.kicad_pro',files:{'local-only.kicad_sch':'LOCAL_ONLY_KICAD_FILE'}};localData.bom=[{id:crypto.randomUUID().toUpperCase(),project:localData.projects[0].name,kicad_source:'resistor-local',item:{designators:'R1',package:'0603',quantity:1,value:'10k'},partID:null,allocationID:null}];const localSaved=await client.save(JSON.stringify(localData));ok(JSON.parse(localSaved.snapshot).bom.length===1,'KiCad requests remain visible locally');let afterLocal=[];for await(const[,handle]of chunks.entries())afterLocal.push(...JSON.parse(browser_storage_decode(new Uint8Array(await(await handle.getFile()).arrayBuffer()))));ok(afterLocal.length===records.length,'Local KiCad links and requests do not create action records');ok(!JSON.stringify(afterLocal).includes('LOCAL_ONLY_KICAD_FILE'),'KiCad project file snapshots stay out of history');

 // Received bundles attach locally without adding a shared action or replacing a user folder.
 const gitData=JSON.parse(client.state.snapshot),gitProject=gitData.projects[0];
 const tipA='a'.repeat(40),tipB='b'.repeat(40),tipC='c'.repeat(40);
 gitProject.git_tips={peer:{reference:'refs/heads/main',commit:tipA,includes:[]}};
 await client.save(JSON.stringify(gitData));
 const apply=async(tip,folder)=>{client.state=await client.call('apply_git_snapshot',{projectId:gitProject.id,tip,selection:{folder,choices:['board.kicad_pro'],files:{}}});return JSON.parse(client.state.snapshot).projects[0].kicad;};
 ok((await apply(tipA,'git-a')).path==='local-only.kicad_pro','Auto apply preserves manually linked project folders');
 const unlinked=JSON.parse(client.state.snapshot);delete unlinked.projects[0].kicad;
 await client.save(JSON.stringify(unlinked));
 let linked=await apply(tipA,'git-a');
 ok(linked.browser_folder==='git-a'&&linked.revision.startsWith('git-snapshot:'),'A sole announced tip automatically attaches its snapshot');
 const stableRevision=linked.revision;
 const newer=JSON.parse(client.state.snapshot);newer.projects[0].git_tips.peer={reference:'refs/heads/main',commit:tipB,includes:[tipA]};await client.save(JSON.stringify(newer));
 ok((await apply(tipA,'stale')).browser_folder==='git-a','A stale download cannot replace a newer announced tip');
 linked=await apply(tipB,'git-b');ok(linked.browser_folder==='git-b'&&linked.revision.endsWith(':'+tipB)&&linked.revision.split(':').slice(0,2).join(':')===stableRevision.split(':').slice(0,2).join(':'),'New snapshots advance the applied tip while preserving open viewer identity');
 const concurrent=JSON.parse(client.state.snapshot);concurrent.projects[0].git_tips.other={reference:'refs/heads/main',commit:tipC,includes:[tipA]};await client.save(JSON.stringify(concurrent));
 ok((await apply(tipC,'conflict')).browser_folder==='git-b','Competing histories remain available without replacing the selected snapshot');
 const restore=JSON.parse(client.state.snapshot);restore.projects[0].kicad=localData.projects[0].kicad;await client.save(JSON.stringify(restore));
 const appId=saved.applicationId;await stop(client);client=fresh();const reopened=await client.init(null,folder);ok(reopened.applicationId===appId,'App identity survives worker restart');ok(JSON.parse(reopened.snapshot).parts[0].stock===7,'Inventory survives reload');ok(JSON.parse(reopened.snapshot).bom.length===1&&JSON.parse(reopened.snapshot).projects[0].kicad.path==='local-only.kicad_pro','Local KiCad requests and binding survive SQLite reload');
 await stop(client);await root.removeEntry('.bom-inventory-sqlite',{recursive:true});client=fresh();const rebuilt=await client.init(null,folder);ok(JSON.parse(rebuilt.snapshot).parts[0].stock===7,'Chunks rebuild a fresh SQLite database without duplicate stock');ok(JSON.parse(rebuilt.snapshot).bom.length===0&&!JSON.parse(rebuilt.snapshot).projects[0].kicad,'History restoration requires reopening the local KiCad file for requests');await stop(client);
 window.testResult={ok:true,text:output.textContent};output.textContent+='\nALL CHECKS PASSED';
}catch(error){window.testResult={ok:false,error:error.stack||String(error),text:output.textContent};output.textContent+='\nFAILED '+(error.stack||error);}
</script>
