[package]
name = "inventory-niimbot"
version = "0.1.0"
edition = "2024"
license = "MIT"
[dependencies]
anyhow = "1"
web-time = "1"
futures-util = "0.3"
uuid = "1"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
btleplug = "0.13.1"
tokio = { version = "1", features = ["time", "sync", "rt"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Event", "EventTarget"] }
futures-channel = "0.3"
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }
