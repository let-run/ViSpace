[package]
name = "inventory-kicad-renderer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reusable wgpu 3D KiCad board renderer with optional egui integration"
[features]
default = ["egui"]
egui = ["dep:egui", "dep:egui-wgpu"]
[dependencies]
bincode = { version = "2.0.1", default-features = false, features = ["std", "serde"] }
inventory-kicad = { path = "../kicad-reader" }
inventory-kicad-models = { path = "../kicad-models" }
serde = { version = "1", features = ["derive", "rc"] }
egui = { version = "0.33", default-features = false, optional = true }
egui-wgpu = { version = "0.33", optional = true }
glam = "0.30"
ab_glyph = "0.2"
epaint_default_fonts = "0.33"
lyon_tessellation = "1"
bytemuck = { version = "1", features = ["derive"] }
i_overlay = { version = "9.1", default-features = false }
earcutr = "0.5"
[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-wgpu = { version = "0.33", features = ["fragile-send-sync-non-atomic-wasm"], optional = true }

[dev-dependencies]
png = "0.18"
