[package]
name = "inventory-barcode-camera"
version = "0.1.0"
edition = "2024"
license = "MIT"
[dependencies]
anyhow = "1"
rxing = { version = "0.9.3", default-features = false, features = ["decoders", "encoding_rs", "full_barcode_format_support"] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native"] }
rayon = "1.12"
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Navigator", "MediaDevices", "MediaDeviceInfo", "MediaDeviceKind", "MediaStream", "MediaStreamTrack", "MediaStreamConstraints", "MediaTrackSettings", "HtmlVideoElement", "HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "Document", "HtmlMediaElement", "Element", "EventTarget"] }
[dev-dependencies]
qrcode = { version = "0.14", default-features = false }
rxing = { version = "0.9.3", default-features = false, features = ["encoders"] }
