name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: vispace-release
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        timeout-minutes: 8
        shell: bash
        run: |
          packages=(build-essential clang libclang-dev pkg-config libdbus-1-dev libudev-dev libxkbcommon-dev libwayland-dev)
          missing=()
          for package in "${packages[@]}"; do
            if [[ "$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null)" != 'install ok installed' ]]; then
              missing+=("$package")
            fi
          done
          if (( ${#missing[@]} == 0 )); then
            echo "Linux build dependencies are already installed."
            exit 0
          fi
          echo "Installing: ${missing[*]}"
          apt_options=(-o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=15)
          sudo -n apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo -n apt-get "${apt_options[@]}" install -y "${missing[@]}"
      - name: Set up Rust and the browser target
        shell: bash
        run: |
          if ! command -v rustup >/dev/null && [[ ! -x "${CARGO_HOME:-$HOME/.cargo}/bin/rustup" ]]; then
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none
          fi
          cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
          export PATH="$cargo_bin:$PATH"
          echo "$cargo_bin" >> "$GITHUB_PATH"
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - name: Check desktop targets
        run: cargo check --locked --all-targets
      - name: Check browser build
        run: cargo check --locked --lib --target wasm32-unknown-unknown
