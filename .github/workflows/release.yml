name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a three-part ViSpace version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag must match Cargo.toml (v$version)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Compile desktop binaries for ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos, runner: macos-15, native: aarch64-apple-darwin, cross: x86_64-apple-darwin }
          - { platform: linux, runner: ubuntu-24.04, native: x86_64-unknown-linux-gnu, cross: aarch64-unknown-linux-gnu }
          - { platform: windows, runner: windows-2025, native: x86_64-pc-windows-msvc, cross: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux native and ARM64 build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i '/^Architectures:/d; /^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/ubuntu-arm64.sources >/dev/null <<'SOURCES'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev pkg-config \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libdbus-1-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libdbus-1-dev:arm64 libudev-dev:arm64 libxkbcommon-dev:arm64 libwayland-dev:arm64

      - name: Compile both architectures
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.native }}
          CROSS_TARGET: ${{ matrix.cross }}
          MACOSX_DEPLOYMENT_TARGET: '12.0'
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_LIBDIR_aarch64_unknown_linux_gnu: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        run: |
          rustup toolchain install stable --profile minimal --target "$NATIVE_TARGET" --target "$CROSS_TARGET"
          suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          for target in "$NATIVE_TARGET" "$CROSS_TARGET"; do
            cargo build --locked --release --bins --target "$target"
            output="release-binaries/$target/release"
            mkdir -p "$output"
            cp "target/$target/release/vispace$suffix" "target/$target/release/vispace-discovery$suffix" "$output/"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-binaries-${{ matrix.platform }}
          path: release-binaries/
          if-no-files-found: error

  package:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    needs: [version, build]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos, arch: aarch64, runner: macos-15, target: aarch64-apple-darwin }
          - { platform: macos, arch: x86_64, runner: macos-15-intel, target: x86_64-apple-darwin }
          - { platform: linux, arch: aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { platform: linux, arch: x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { platform: windows, arch: arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc, wix_arch: arm64 }
          - { platform: windows, arch: x86_64, runner: windows-2025, target: x86_64-pc-windows-msvc, wix_arch: x64 }
    env:
      RUST_TARGET: ${{ matrix.target }}
      PACKAGE_ARCH: ${{ matrix.arch }}
      VISPACE_PACKAGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: desktop-binaries-${{ matrix.platform }}
          path: target

      - name: Prepare package output
        shell: bash
        run: |
          mkdir -p release-output
          if [[ "$RUNNER_OS" != Windows ]]; then
            chmod +x "target/$RUST_TARGET/release/"{vispace,vispace-discovery}
          fi

      - name: Sign, notarize, and verify DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -u
          for secret in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [[ -z "${!secret:-}" ]]; then
              echo "::error::Missing GitHub Actions secret $secret"
              exit 1
            fi
          done

          umask 077
          work=$(mktemp -d "$RUNNER_TEMP/vispace-signing.XXXXXX")
          keychain="$work/signing.keychain-db"
          cleanup() {
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$work"
          }
          trap cleanup EXIT
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$work/certificate.p12"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$work/notary.p8"
          unset MACOS_CERTIFICATE_P12_BASE64 APPLE_API_KEY_P8
          keychain_password=$(openssl rand -hex 32)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$work/certificate.p12" -k "$keychain" -f pkcs12 -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$work/certificate.p12"
          unset MACOS_CERTIFICATE_PASSWORD
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application:/ { print $2 }')
          if [[ ! "$identity" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "::error::The .p12 must contain one valid Developer ID Application identity and its private key"
            exit 1
          fi

          # Use normal file permissions for the distributed application.
          umask 022
          ./script/build_and_run.sh --package-only "target/$RUST_TARGET/release"
          app=dist/ViSpace.app
          mac_arch=$PACKAGE_ARCH
          if [[ "$mac_arch" == aarch64 ]]; then mac_arch=arm64; fi
          lipo "$app/Contents/MacOS/vispace" -verify_arch "$mac_arch"
          lipo "$app/Contents/MacOS/vispace-discovery" -verify_arch "$mac_arch"
          signing=(--force --timestamp --keychain "$keychain" --sign "$identity")
          codesign "${signing[@]}" --options runtime "$app/Contents/MacOS/vispace-discovery"
          codesign "${signing[@]}" --options runtime "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          "$app/Contents/MacOS/vispace" --check --data "$RUNNER_TEMP/smoke.sqlite"
          mkdir "$work/staging"
          ditto "$app" "$work/staging/ViSpace.app"
          ln -s /Applications "$work/staging/Applications"
          dmg="release-output/ViSpace-$VISPACE_PACKAGE_VERSION-macos-$PACKAGE_ARCH.dmg"
          hdiutil makehybrid -hfs -hfs-volume-name ViSpace -o "$work/ViSpace-uncompressed.dmg" "$work/staging"
          hdiutil convert "$work/ViSpace-uncompressed.dmg" -format UDZO -o "$dmg"
          codesign "${signing[@]}" "$dmg"
          notary_credentials=(--key "$work/notary.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          submit_result=0
          xcrun notarytool submit "$dmg" "${notary_credentials[@]}" --wait --timeout 30m --output-format json > "$work/notary.json" || submit_result=$?
          cat "$work/notary.json"
          status=$(plutil -extract status raw -o - "$work/notary.json" 2>/dev/null || true)
          if [[ "$submit_result" != 0 || "$status" != Accepted ]]; then
            submission=$(plutil -extract id raw -o - "$work/notary.json" 2>/dev/null || true)
            if [[ -n "$submission" ]]; then
              xcrun notarytool log "$submission" "${notary_credentials[@]}" || true
            fi
            echo "::error::Apple notarization did not accept the DMG"
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          codesign --verify --verbose=2 "$dmg"
          hdiutil verify "$dmg"

      - name: Install AppImage smoke-test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-3 libudev1 libxkbcommon0 libwayland-client0

      - name: Build and verify AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./script/package_appimage.sh "$RUST_TARGET" "$PWD/release-output/ViSpace-$VISPACE_PACKAGE_VERSION-linux-$PACKAGE_ARCH.AppImage"

      - name: Smoke-test Windows release binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "target/$env:RUST_TARGET/release/vispace.exe"
          $database = Join-Path $env:RUNNER_TEMP 'smoke.sqlite'
          & $exe --check --data $database

      - name: Build MSI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WIX_ARCH: ${{ matrix.wix_arch }}
        run: |
          $bin = "target/$env:RUST_TARGET/release"
          $tools = Join-Path $env:RUNNER_TEMP 'wix-tools'
          dotnet tool install wix --version 6.0.2 --tool-path "$tools"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $msi = "release-output/ViSpace-$env:VISPACE_PACKAGE_VERSION-windows-$env:PACKAGE_ARCH.msi"
          & "$tools/wix.exe" build packaging/vispace.wxs -arch $env:WIX_ARCH -d "Version=$env:VISPACE_PACKAGE_VERSION" -d "BinDir=$((Resolve-Path $bin).Path)" -d "SourceDir=$env:GITHUB_WORKSPACE" -o "$msi"

      - uses: actions/upload-artifact@v4
        with:
          name: ViSpace-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release-output/*.dmg
            release-output/*.AppImage
            release-output/*.msi
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish installers
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ViSpace-*
          path: release-output
          merge-multiple: true
      - name: Upload installers and checksums
        working-directory: release-output
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          installers=(*.dmg *.AppImage *.msi)
          sha256sum "${installers[@]}" > SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${installers[@]}" SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${installers[@]}" SHA256SUMS.txt
          fi
